<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0c18"><title>DR SOUND LAB Player</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f4ff;background:#0c0c18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0%,#32205d 0%,transparent 42%),#0c0c18;display:grid;place-items:center;padding:18px}.app{width:min(100%,510px);background:#171728;border:1px solid #484067;border-radius:26px;padding:25px;box-shadow:0 20px 60px #0008}h1{margin:0;color:#c7a5ff;font-size:1.65rem}.sub{color:#b5b3cb;margin:7px 0 24px}.art{height:180px;border-radius:19px;background:linear-gradient(135deg,#1e4a6e,#542579 60%,#171728);display:grid;place-items:center;font-size:80px;box-shadow:inset 0 0 50px #75dcff33}.track{font-weight:700;font-size:1.1rem;margin:20px 0 6px;overflow-wrap:anywhere}.hint{font-size:.85rem;color:#aaa6c6;margin-bottom:16px}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:15px 0}button,.upload{background:#a76dff;color:#100d1c;border:0;border-radius:13px;padding:13px 18px;font-weight:750;cursor:pointer}.play{font-size:1.2rem;min-width:110px}button:disabled{opacity:.45;cursor:not-allowed}.upload{display:block;text-align:center;margin:20px 0 10px}input[type=file]{display:none}input[type=range]{accent-color:#8bdcff;width:100%}.times{display:flex;justify-content:space-between;color:#b5b3cb;font-size:.8rem}.vol{display:flex;align-items:center;gap:12px;margin-top:14px;color:#b5b3cb;font-size:.9rem}.footer{font-size:.78rem;color:#9995b5;line-height:1.5;margin-top:20px} .glow{color:#81eaff}
</style></head><body><main class="app"><h1>♫ DR SOUND LAB</h1><p class="sub">La tua musica, ovunque. <span class="glow">Player demo</span></p><div class="art" aria-hidden="true">♫</div><div class="track" id="name">Nessuna canzone caricata</div><div class="hint" id="status">Scegli un file MP3 o WAV dal tuo dispositivo.</div><label class="upload" for="file">＋ Carica una canzone</label><input id="file" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,.mp3,.wav"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="100" value="0" aria-label="Posizione del brano"><div class="controls"><button class="play" id="play" disabled>▶ Play</button><button id="stop" disabled>■ Stop</button></div><div class="vol"><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div><p class="footer">Questa prima versione riproduce file locali: non li carica su Internet e non li conserva. La libreria cloud privata/pubblica arriverà nel prossimo passo.</p><audio id="audio" preload="metadata"></audio></main><script>
const audio=document.getElementById('audio'),file=document.getElementById('file'),play=document.getElementById('play'),stop=document.getElementById('stop'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),status=document.getElementById('status');let objectUrl=null;const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);audio.pause();objectUrl=URL.createObjectURL(f);audio.src=objectUrl;document.getElementById('name').textContent=f.name;status.textContent='Pronta per l’ascolto';play.disabled=false;stop.disabled=false;play.textContent='▶ Play';seek.value=0;document.getElementById('current').textContent='0:00';document.getElementById('duration').textContent='0:00'});play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){status.textContent='Impossibile riprodurre il file: prova un altro MP3/WAV.'}}else audio.pause()});stop.addEventListener('click',()=>{audio.pause();audio.currentTime=0});audio.addEventListener('play',()=>{play.textContent='Ⅱ Pausa';status.textContent='In riproduzione'});audio.addEventListener('pause',()=>{play.textContent='▶ Play';if(audio.src)status.textContent='In pausa'});audio.addEventListener('loadedmetadata',()=>{document.getElementById('duration').textContent=fmt(audio.duration)});audio.addEventListener('timeupdate',()=>{document.getElementById('current').textContent=fmt(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*100:0});seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/100});volume.addEventListener('input',()=>{audio.volume=Number(volume.value)});audio.volume=.8;audio.addEventListener('ended',()=>{status.textContent='Riproduzione terminata'});audio.addEventListener('error',()=>{status.textContent='Formato non supportato o file danneggiato.'});
</script></body></html>
